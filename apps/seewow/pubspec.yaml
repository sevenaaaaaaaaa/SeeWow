name: seewow
description: "SeeWow — Cinema for every screen. A cross-platform personal cinema player."
publish_to: 'none'
version: 1.10.0+13

environment:
  sdk: ^3.13.7

dependencies:
  xml: ^7.0.1
  crypto: ^3.0.8
  file_picker: ^13.3.2
  flutter:
    sdk: flutter
  media_kit: ^1.2.6
  media_kit_libs_video: ^1.0.7
  media_kit_video: ^2.0.1
  path_provider: ^2.1.6
  window_manager: ^0.5.2
  url_launcher: ^6.3.3
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/fonts/
    - assets/branding/
  fonts:
    - family: NotoSerifTibetan
      fonts:
        - asset: assets/fonts/NotoSerifTibetan-Variable.ttf
    - family: NotoSansArabic
      fonts:
        - asset: assets/fonts/NotoSansArabic-Variable.ttf
    - family: SourceSerif4
      fonts:
        - asset: assets/fonts/SourceSerif4-Regular.otf
        - asset: assets/fonts/SourceSerif4-Semibold.otf
          weight: 500
        - asset: assets/fonts/SourceSerif4-Semibold.otf
          weight: 600
        - asset: assets/fonts/SourceSerif4-Bold.otf
          weight: 700
    - family: JetBrainsMono
      fonts:
        - asset: assets/fonts/JetBrainsMono-Regular.ttf
        - asset: assets/fonts/JetBrainsMono-Medium.ttf
          weight: 500
        - asset: assets/fonts/JetBrainsMono-SemiBold.ttf
          weight: 600