[package]
name = "seewow-player"
description = "SeeWow 播放宿主：libmpv + 自持窗口定位 + HDR 探针（M1 走通骨架）"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
crossbeam-channel.workspace = true
libmpv2.workspace = true
objc2.workspace = true
objc2-app-kit = { workspace = true, features = [
  "NSWindow",
  "NSScreen",
  "NSView",
  "NSEvent",
  "NSApplication",
  "NSResponder",
  "NSGraphics",
  "objc2-core-foundation",
] }
objc2-foundation = { workspace = true, features = ["NSString", "NSArray", "NSGeometry"] }