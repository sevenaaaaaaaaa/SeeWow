# workspace：SeeWow Rust 重写（macOS 首发）
# 目录与成员见 HLD §3.1；依赖冻结见 HLD §3.4（M1 一次写全，新依赖走 CRD）
[workspace]
resolver = "3"
members = [
  "crates/core",
  "crates/library",
  "crates/sources",
  "crates/player",
  "crates/ui",
  "crates/app",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
license = "GPL-3.0-only"
publish = false

[workspace.dependencies]
crossbeam-channel = "0.5.15"
objc2 = "0.6.5"
objc2-foundation = { version = "0.3.2", default-features = false, features = ["std"] }
objc2-app-kit = { version = "0.3.2", default-features = false, features = ["std"] }
block2 = "0.6.2"
slint = { version = "1.18.1", default-features = false, features = [
  "std",
  "backend-winit",
  "renderer-femtovg",
  "compat-1-2",
] }
slint-build = "1.18.1"
libmpv2 = { version = "7.0.0", default-features = false }
