name: build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  FLUTTER_VERSION: 3.47.9
  FLUTTER_CHANNEL: stable

jobs:
  macos:
    runs-on: macos-latest
    defaults: { run: { working-directory: apps/seewow } }
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: ${{ env.FLUTTER_CHANNEL }}
          cache: true
      # mpv 的 bottle 有几十个依赖，冷装一次 ~13 分钟。缓存下载目录后
      # 只是"倒瓶子"，实测能把这一步压到 2 分钟上下。
      - name: Cache Homebrew downloads
        uses: actions/cache@v4
        with:
          path: ~/Library/Caches/Homebrew
          key: brew-macos-mpv-v1
      - name: Install mpv
        run: brew install mpv
        env:
          HOMEBREW_NO_AUTO_UPDATE: "1"
          HOMEBREW_NO_INSTALL_CLEANUP: "1"
      - run: flutter pub get

      # --- P0 质量门禁（Q-01）---
      # 以前这里只有 build：CI 全绿只证明"能编译"。这两步让"行为坏了"也能拦住。
      - name: Analyze (error / warning 阻塞，历史 info 不阻塞)
        timeout-minutes: 10
        run: |
          set +e
          flutter analyze lib test > analyze.log 2>&1
          cat analyze.log
          bad=$(grep -cE '^[[:space:]]+(error|warning) •' analyze.log || true)
          if [ "${bad:-0}" -gt 0 ]; then
            echo "::error::flutter analyze found ${bad} error/warning issue(s)"
            exit 1
          fi
          if ! grep -qE "issues found|No issues found" analyze.log; then
            echo "::error::analyze did not finish"
            exit 1
          fi
          echo "analyze: 0 error / 0 warning（历史 info 不计入阻塞）"
      - name: Test (1.18 基线 319 通过 / 2 跳过)
        timeout-minutes: 25
        run: flutter test --concurrency=1

      - run: flutter build macos --release
      - uses: actions/upload-artifact@v4
        with:
          name: SeeWow-macos
          path: apps/seewow/build/macos/Build/Products/Release/*.app

  windows:
    runs-on: windows-latest
    defaults: { run: { working-directory: apps/seewow } }
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: ${{ env.FLUTTER_CHANNEL }}
          cache: true
      - run: flutter pub get
      - run: flutter build windows --release
      - uses: actions/upload-artifact@v4
        with:
          name: SeeWow-windows
          path: apps/seewow/build/windows/x64/runner/Release/

  linux:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: apps/seewow } }
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: ${{ env.FLUTTER_CHANNEL }}
          cache: true
      - run: sudo apt-get update && sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev libmpv-dev mpv liblzma-dev
      - run: flutter pub get
      - run: flutter build linux --release
      - uses: actions/upload-artifact@v4
        with:
          name: SeeWow-linux
          path: apps/seewow/build/linux/x64/release/bundle/

  android:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: apps/seewow } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: ${{ env.FLUTTER_CHANNEL }}
          cache: true
      - run: flutter pub get
      - run: flutter build apk --release
      - uses: actions/upload-artifact@v4
        with:
          name: SeeWow-android
          path: apps/seewow/build/app/outputs/flutter-apk/app-release.apk

  ios:
    runs-on: macos-latest
    defaults: { run: { working-directory: apps/seewow } }
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: ${{ env.FLUTTER_CHANNEL }}
          cache: true
      - run: flutter pub get
      - run: flutter build ios --release --no-codesign
      - uses: actions/upload-artifact@v4
        with:
          name: SeeWow-ios
          path: apps/seewow/build/ios/iphoneos/Runner.app
