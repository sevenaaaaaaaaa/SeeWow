name: build

on:
  push:
    branches: [main]
    tags: ['v*']          # 打 tag = 走发布：五个平台构建完成后自动建 Release 并传资产
  pull_request:
  workflow_dispatch:

env:
  FLUTTER_VERSION: 3.47.9
  FLUTTER_CHANNEL: stable

jobs:
  macos:
    runs-on: macos-latest
    defaults: { run: { working-directory: apps/seewow } }
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: ${{ env.FLUTTER_CHANNEL }}
          cache: true
      # mpv 的 bottle 有几十个依赖，冷装一次 ~13 分钟。缓存下载目录后
      # 只是"倒瓶子"，实测能把这一步压到 2 分钟上下。
      - name: Cache Homebrew downloads
        uses: actions/cache@v4
        with:
          path: ~/Library/Caches/Homebrew
          key: brew-macos-mpv-v1
      - name: Install mpv
        run: brew install mpv
        env:
          HOMEBREW_NO_AUTO_UPDATE: "1"
          HOMEBREW_NO_INSTALL_CLEANUP: "1"
      - run: flutter pub get

      # --- P0 质量门禁（Q-01）---
      # 以前这里只有 build：CI 全绿只证明"能编译"。这两步让"行为坏了"也能拦住。
      - name: Analyze (error / warning 阻塞，历史 info 不阻塞)
        timeout-minutes: 10
        run: |
          set +e
          flutter analyze lib test > analyze.log 2>&1
          cat analyze.log
          # flutter analyze 把严重级别右对齐到 7 列（"warning" 正好 7 个字符）：
          #    warning • ...   ← 0 个前导空格，从第 0 列开始
          #      error • ...   ← 2 个前导空格
          #       info • ...   ← 3 个前导空格
          # 所以行首缩进必须写 [[:space:]]*，写成 [[:space:]]+ 会永远数不到 warning。
          # 分隔符写成「非字母数字」，同时兼容 "error •" / "error -" / "error:" 三种格式。
          SEV='^[[:space:]]*(info|warning|error)[[:space:]]*[^[:alnum:][:space:]]'
          bad=$(grep -cE "^[[:space:]]*(error|warning)[[:space:]]*[^[:alnum:][:space:]]" analyze.log || true)
          any=$(grep -cE "${SEV}" analyze.log || true)
          # 注意 issues? —— 只有 1 条问题时 flutter 输出的是 "1 issue found."（单数）。
          if ! grep -qE "issues? found|No issues found" analyze.log; then
            echo "::error::analyze did not finish"
            exit 1
          fi
          # 格式漂移保护：报了问题却一条级别行都认不出来 = 解析失配，不许静默变绿。
          if grep -qE "[1-9][0-9]* issues? found" analyze.log && [ "${any:-0}" -eq 0 ]; then
            echo "::error::analyze reported issues but no severity line was parsed — output format changed"
            exit 1
          fi
          if [ "${bad:-0}" -gt 0 ]; then
            echo "::error::flutter analyze found ${bad} error/warning issue(s)"
            exit 1
          fi
          echo "analyze: 0 error / 0 warning（历史 info 不计入阻塞，共 ${any:-0} 条 info）"
      - name: Test (1.18 基线 319 通过 / 2 跳过)
        timeout-minutes: 25
        run: flutter test --concurrency=1

      # 公开包按分发规则不带任何内置播放源：站点由用户自己填或导入。
      # 只传 --dart-define 不够（1.21.5 的 APK 里还躺着 3718 字节的源包文件，
      # 站点地址也在 AOT 二进制里）：构建前移走源包与代码种子，构建后验产物。
      - name: Prepare public assets (no built-in sources)
        run: bash tool/ci_public_build.sh prep
      - run: flutter build macos --release --dart-define=SEEWOW_NO_BUILTIN_SOURCES=true --dart-define-from-file=build/public_defines.json
      - name: Verify the artifact carries no sources
        run: bash tool/ci_public_build.sh verify "$(ls -d build/macos/Build/Products/Release/*.app | head -1)"
      # 不能把 .app 直接交给 upload-artifact：它不保留符号链接，往返一次会把
      # X.framework/{X, Versions/Current/X} 变成三份真文件 —— 1.21.5 的 macOS 包
      # 因此是 318 MB 解压 / 124 MB 下载（正常 108 MB / 42 MB）。先打成 zip 再传，
      # 上传的就是用户最终拿到的那一份，发版时原样复制。
      - name: Package (symlinks preserved)
        run: |
          set -euo pipefail
          app="$(ls -d build/macos/Build/Products/Release/*.app | head -1)"
          ditto -c -k --norsrc --keepParent "$app" build/SeeWow-macos.zip
          python3 tool/check_macos_zip.py build/SeeWow-macos.zip
      - uses: actions/upload-artifact@v4
        with:
          name: SeeWow-macos
          path: apps/seewow/build/SeeWow-macos.zip

  windows:
    runs-on: windows-latest
    defaults: { run: { working-directory: apps/seewow } }
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: ${{ env.FLUTTER_CHANNEL }}
          cache: true
      - run: flutter pub get
      - name: Prepare public assets (no built-in sources)
        shell: bash
        run: bash tool/ci_public_build.sh prep
      - run: flutter build windows --release --dart-define=SEEWOW_NO_BUILTIN_SOURCES=true --dart-define-from-file=build/public_defines.json
      - name: Verify the artifact carries no sources
        shell: bash
        run: bash tool/ci_public_build.sh verify build/windows/x64/runner/Release
      - uses: actions/upload-artifact@v4
        with:
          name: SeeWow-windows
          path: apps/seewow/build/windows/x64/runner/Release/

  linux:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: apps/seewow } }
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: ${{ env.FLUTTER_CHANNEL }}
          cache: true
      - run: sudo apt-get update && sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev libmpv-dev mpv liblzma-dev
      - run: flutter pub get
      - name: Prepare public assets (no built-in sources)
        run: bash tool/ci_public_build.sh prep
      - run: flutter build linux --release --dart-define=SEEWOW_NO_BUILTIN_SOURCES=true --dart-define-from-file=build/public_defines.json
      - name: Verify the artifact carries no sources
        run: bash tool/ci_public_build.sh verify build/linux/x64/release/bundle
      - uses: actions/upload-artifact@v4
        with:
          name: SeeWow-linux
          path: apps/seewow/build/linux/x64/release/bundle/

  android:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: apps/seewow } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: ${{ env.FLUTTER_CHANNEL }}
          cache: true
      - run: flutter pub get
      - name: Prepare public assets (no built-in sources)
        run: bash tool/ci_public_build.sh prep
      - run: flutter build apk --release --dart-define=SEEWOW_NO_BUILTIN_SOURCES=true --dart-define-from-file=build/public_defines.json
      - name: Verify the artifact carries no sources
        run: bash tool/ci_public_build.sh verify build/app/outputs/flutter-apk/app-release.apk
      - uses: actions/upload-artifact@v4
        with:
          name: SeeWow-android
          path: apps/seewow/build/app/outputs/flutter-apk/app-release.apk

  ios:
    runs-on: macos-latest
    defaults: { run: { working-directory: apps/seewow } }
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: ${{ env.FLUTTER_CHANNEL }}
          cache: true
      - run: flutter pub get
      - name: Prepare public assets (no built-in sources)
        run: bash tool/ci_public_build.sh prep
      - run: flutter build ios --release --no-codesign --dart-define=SEEWOW_NO_BUILTIN_SOURCES=true --dart-define-from-file=build/public_defines.json
      - name: Verify the artifact carries no sources
        run: bash tool/ci_public_build.sh verify build/ios/iphoneos/Runner.app
      - uses: actions/upload-artifact@v4
        with:
          name: SeeWow-ios
          path: apps/seewow/build/ios/iphoneos/Runner.app

  # ---- tag 发布：五个平台的产物打成 Release 资产 ----
  # 为什么搬进 CI：本机到 GitHub 的上行实测只有 10–20 KB/s，一次 40 MB 的安装包要传 40 分钟以上，
  # 中途断一次就白跑；runner 传资产走 GitHub 内网，几秒完成。本地只剩 git push v* 这一下。
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [macos, windows, linux, android, ios]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 版本号必须与 tag 一致
        run: |
          set -euo pipefail
          V="${GITHUB_REF_NAME#v}"
          FOUND=$(grep -m1 '^version:' apps/seewow/pubspec.yaml | awk '{print $2}' | cut -d+ -f1)
          echo "pubspec=$FOUND tag=$V"
          if [ "$FOUND" != "$V" ]; then
            echo "::error::pubspec 里是 ${FOUND}，tag 是 ${GITHUB_REF_NAME} —— 先 bump apps/seewow/pubspec.yaml 再打 tag"
            exit 1
          fi

      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: 打包 + 校验和
        run: |
          set -euo pipefail
          V="${GITHUB_REF_NAME#v}"
          mkdir -p out
          # 不要把 ls | head 放进 set -o pipefail：head 提前关闭管道会让 ls 以
          # SIGPIPE 收场，整步直接失败（v1.21.5 第一次打 tag 就栽在这里）。
          find artifacts -maxdepth 2 -type d | sort

          # 只发公开可分发的包：桌面三端 + Android。iOS 是未签名产物，装不上，
          # 也不该出现在公开下载里；它留在 Actions artifacts 供自签使用。
          if [ -f artifacts/SeeWow-macos/SeeWow-macos.zip ]; then
            cp artifacts/SeeWow-macos/SeeWow-macos.zip "out/SeeWow-macos-${V}-public-nosources.zip"
            # 复核一次：资产必须仍是「符号链接在、体积正常」的那一份
            python3 apps/seewow/tool/check_macos_zip.py "out/SeeWow-macos-${V}-public-nosources.zip"
          fi
          if [ -d artifacts/SeeWow-windows ]; then
            ( cd artifacts/SeeWow-windows && zip -qry "../../out/SeeWow-windows-${V}-public-nosources.zip" . )
          fi
          if [ -d artifacts/SeeWow-linux ]; then
            ( cd artifacts/SeeWow-linux && tar -czf "../../out/SeeWow-linux-${V}-public-nosources.tar.gz" . )
          fi
          if [ -f artifacts/SeeWow-android/app-release.apk ]; then
            cp artifacts/SeeWow-android/app-release.apk "out/SeeWow-Android-${V}.apk"
          fi

          cd out
          sha256sum * > SHA256SUMS.txt
          cat SHA256SUMS.txt
          du -sh ./*

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: SeeWow ${{ github.ref_name }}
          files: out/*
          fail_on_unmatched_files: true
          generate_release_notes: true
