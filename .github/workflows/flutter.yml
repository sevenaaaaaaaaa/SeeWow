name: build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  FLUTTER_VERSION: 3.47.9
  FLUTTER_CHANNEL: stable

jobs:
  macos:
    runs-on: macos-latest
    defaults: { run: { working-directory: apps/seewow } }
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: ${{ env.FLUTTER_CHANNEL }}
          cache: true
      - run: brew install mpv
      - run: flutter pub get
      - run: flutter build macos --release
      - uses: actions/upload-artifact@v4
        with:
          name: SeeWow-macos
          path: apps/seewow/build/macos/Build/Products/Release/*.app

  windows:
    runs-on: windows-latest
    defaults: { run: { working-directory: apps/seewow } }
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: ${{ env.FLUTTER_CHANNEL }}
          cache: true
      - run: flutter pub get
      - run: flutter build windows --release
      - uses: actions/upload-artifact@v4
        with:
          name: SeeWow-windows
          path: apps/seewow/build/windows/x64/runner/Release/

  linux:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: apps/seewow } }
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: ${{ env.FLUTTER_CHANNEL }}
          cache: true
      - run: sudo apt-get update && sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev libmpv-dev mpv liblzma-dev
      - run: flutter pub get
      - run: flutter build linux --release
      - uses: actions/upload-artifact@v4
        with:
          name: SeeWow-linux
          path: apps/seewow/build/linux/x64/release/bundle/

  android:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: apps/seewow } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: ${{ env.FLUTTER_CHANNEL }}
          cache: true
      - run: flutter pub get
      - run: flutter build apk --release
      - uses: actions/upload-artifact@v4
        with:
          name: SeeWow-android
          path: apps/seewow/build/app/outputs/flutter-apk/app-release.apk

  ios:
    runs-on: macos-latest
    defaults: { run: { working-directory: apps/seewow } }
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: ${{ env.FLUTTER_CHANNEL }}
          cache: true
      - run: flutter pub get
      - run: flutter build ios --release --no-codesign
      - uses: actions/upload-artifact@v4
        with:
          name: SeeWow-ios
          path: apps/seewow/build/ios/iphoneos/Runner.app
